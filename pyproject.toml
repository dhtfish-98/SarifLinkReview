[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sariflinkreview"
version = "1.0.2"
authors = [{ name = "dhtfish98" }]
description = "Bounded offline evidence review: SarifLinkReview"
requires-python = ">=3.10"
license = "MIT"
license-files = ["项目文档/LICENSE", "NEW_IMPLEMENTATION_NOTICE.txt"]
dependencies = []

[project.scripts]
sariflinkreview = "sariflinkreview.core:main"

[tool.setuptools.packages.find]
where = ["src"]
