[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sariflinkreview"
version = "1.0.1"
description = "Bounded offline evidence review: SarifLinkReview"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
sariflinkreview = "sariflinkreview.core:main"

[tool.setuptools.packages.find]
where = ["src"]
