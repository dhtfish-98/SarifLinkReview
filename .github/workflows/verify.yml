name: Verify local defensive scope
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install this independent project
        run: |
          python -m pip install .
          if [ -f requirements-test.txt ]; then python -m pip install -r requirements-test.txt; fi
      - name: Verify supported behavior and malformed inputs
        run: python -m unittest discover -s tests -v
      - name: Build installable artifact
        run: python -m pip wheel --no-deps --wheel-dir artifacts .
